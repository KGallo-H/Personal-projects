<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Task List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .text-decoration-line-through {
            text-decoration: line-through;
            color: dimgrey;
        }
    </style>
</head>


<body>
    

    <div class="container">
        <h1 class = "mt-5 text-center">Task List </h1>
        <form action="/" method="post" class="row mt-3">
            <div class="col-md-10">
                <input class="form-control form-control-lg" type="text" name="title" placeholder="New Task Title" required>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary btn-lg btn-block">Add Task</button>
            </div>
            
        </form>

        <div class="mt-4">
            <th:block th:each="task : ${tasks}">
                <div class="card mb-2">
                    <div class ="card-body d-flex justify-content-between align-items-center">
                    <span th:classappend="${task.completed} ? 'text-decoration-line-through' : ''" th:text="${task.title}">Task Title</span> 

                        <div>
                            <a th:href="@{/{id}/toggle(id=${task.id})}" class="btn btn-sm btn-secondary me-2" th:text="${task.completed} ? 'Mark Incomplete' : 'Mark Complete'">Toggle</a>
                            <a th:href="@{/{id}/delete(id=${task.id})}" class="btn btn-sm btn-danger">Delete</a>
                        </div>
                    </div>
                </div>
            </th:block>
        </div>

    </div>
    
</body>




</html>
